name: Validar y simular un deploy

on: 
  push: 
    branches: ["main"]
permissions: 
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar Repositorio
        uses: actions/checkout@v4
      - name: "Paso 1 Estructura de carpetas"
        uses: |
          test -d app
          test -f app/index.php
          test -f Dockerfile
          test -f docker-compose.yml

      - name: "construccion"
        uses: docker compose build
      
